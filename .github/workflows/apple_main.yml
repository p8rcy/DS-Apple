      - name: Build Apple Watch App (watchOS Generic Device)
        run: |
          xcodebuild -project DinkScore.xcodeproj \
            -target DinkScoreWatch \
            -configuration Release \
            -sdk watchos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Build iPhone/iPad App + Embed Watch App & Package Unsigned IPA
        run: |
          xcodebuild -project DinkScore.xcodeproj \
            -target DinkScore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DinkScore.app Payload/
          mkdir -p Payload/DinkScore.app/Watch
          cp -R build/DerivedData/Build/Products/Release-watchos/DinkScoreWatch.app Payload/DinkScore.app/Watch/
          zip -r9 DinkScore-v4.4-iOS-With-Watch.ipa Payload

      - name: Upload Unsigned iOS + watchOS IPA & Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: DinkScore-v4.4-iOS-Unsigned-IPA
          path: |
            DinkScore-v4.4-iOS-With-Watch.ipa
            DinkScore.xcodeproj
            Sources/
            Config/
