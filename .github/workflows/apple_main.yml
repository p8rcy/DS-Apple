      - name: Build iPhone/iPad App & Apple Watch Companion (v4.4)
        run: |
          set -o pipefail
          if ! /usr/bin/xcodebuild -project DinkScore.xcodeproj \
            -target DinkScore \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build_ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build_ios.log; then
            echo "### iOS Build Error Log" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
            grep -E "(error:|fatal error:)" -C 3 build_ios.log >> "$GITHUB_STEP_SUMMARY" || tail -n 60 build_ios.log >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mkdir -p Payload
          cp -R build_ios/Release-iphoneos/DinkScore.app Payload/

          # Check if watchOS SDK is installed on this runner (or in another installed Xcode bundle)
          WATCH_XCODE_DEV=""
          if /usr/bin/xcodebuild -version -sdk watchos >/dev/null 2>&1; then
            WATCH_XCODE_DEV="$(xcode-select -p)"
          else
            for xc in /Applications/Xcode*.app/Contents/Developer; do
              if [ -d "$xc/Platforms/WatchOS.platform" ]; then
                WATCH_XCODE_DEV="$xc"
                break
              fi
            done
          fi

          if [ -n "$WATCH_XCODE_DEV" ]; then
            echo "Found watchOS SDK at $WATCH_XCODE_DEV — building Apple Watch app..."
            if DEVELOPER_DIR="$WATCH_XCODE_DEV" /usr/bin/xcodebuild -project DinkScore.xcodeproj \
              -target DinkScoreWatch \
              -configuration Release \
              -sdk watchos \
              SYMROOT="$PWD/build_watch" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build 2>&1 | tee build_watch.log; then
              mkdir -p Payload/DinkScore.app/Watch
              cp -R build_watch/Release-watchos/DinkScoreWatch.app Payload/DinkScore.app/Watch/
            else
              echo "watchOS build skipped; packaging iOS IPA + complete Xcode project."
            fi
          else
            echo "watchOS SDK not pre-installed on this macOS arm64 runner; packaging iOS IPA + complete Xcode project."
          fi

          /usr/bin/zip -qry DinkScore-v4.4-iOS.ipa Payload

      - name: Upload DinkScore v4.4 Apple Bundle (IPA + Xcode Project)
        uses: actions/upload-artifact@v4
        with:
          name: DinkScore-v4.4-Apple-Bundle
          path: |
            DinkScore-v4.4-iOS.ipa
            DinkScore-v4.4-XcodeProject.zip
            DinkScore.xcodeproj
            Sources/
            Resources/
